# Lite SAO fine-tune PoC — matched step budget across three data arms.
# Arms: Slakh | sPDMX BDGP-eligible (sep-aligned) | sPDMX full corpus

seed: 43
max_steps: 10000
sample_rate: 44100
sample_size: 2097152  # ~47s at 44.1kHz (SAO default-ish crop)
batch_size: 8

# HuggingFace / local unwrapped Stable Audio Open checkpoint.
pretrained_ckpt: null  # set after download, or pass --pretrained-ckpt
model_config: model_config.json
# stable-audio-tools logger: none | wandb | comet
logger: none

# Captions (GM class names for sPDMX; BDGP labels for Slakh when available)
caption_template: "instrumental music, {instruments}"

# Mix rendering for sPDMX (Slakh already has mix.flac).
render_jobs: 8
# Optional cap while indexing sPDMX (null = all songs with on-disk stems).
# Full release is ~250k songs — rendering all mixes is large on disk/time.
spdmx_index_max_songs: null

# Optional path overrides (else SPDMX_SLAKH_ROOT / SPDMX_DATASET_ROOT / .env).
# slakh_root: /deepfreeze/share/pnlong/slakh2100_flac_redux
# spdmx_root: /deepfreeze/share/SPDMX/SPDMX

# Eval
n_prompts: 50
n_seeds_per_prompt: 2
gen_steps: 100
guidance_scale: 7.0
