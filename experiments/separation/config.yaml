# ICASSP PoC — Hybrid Demucs: Slakh vs SPDMX (BDGP) vs both (matched steps)

seed: 43
sample_rate: 44100
# Matched optimizer step budget across train arms (slakh | spdmx | both).
max_steps: 32000
batch_size: 8
segment_seconds: 10.0
lr: 3.0e-4
num_workers: 4
# Channels: demucs HTDemucs expects stereo; we duplicate mono → stereo.
channels: 2

# Logging / validation (only three ckpts: last.ckpt, best_val.ckpt, best_train.ckpt)
# UI: one progress bar per train segment of val_every steps, then a val line.
log_every: 1000          # average train L1 → losses.csv / losses.jsonl; refresh last.ckpt
val_every: 1000        # segment length + val cadence; saves best_val.ckpt on improvement
val_max_batches: null  # null = full val set; set e.g. 32 to cap val cost

sources:
  - bass
  - drums
  - guitar
  - piano

# Separation packs require all four BDGP targets (Slakh-comparable protocol).
require_all_targets: true
spdmx_require_all_targets: true

# Paths (override with env SPDMX_SLAKH_ROOT / SPDMX_DATASET_ROOT / SPDMX_MUSDB_ROOT).
# slakh_root: /deepfreeze/share/pnlong/slakh2100_flac_redux
# Chunked sPDMX release (Zenodo layout); not SPDMX_dev.
spdmx_root: /deepfreeze/share/SPDMX/SPDMX
# musdb_root: /deepfreeze/share/pnlong/musdb18hq

# Held-out fraction of BDGP-eligible sPDMX songs for validation.
spdmx_val_fraction: 0.05
