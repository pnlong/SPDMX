# Full multi-stem SPDMX: 2-source HTDemucs (stem vs other). No Slakh / BDGP.
# v3 recipe: stronger stem/SI-SDR weights + energy-aligned val + stem-sum mix
# (v2 val used silent intros / tracks[0] only; train filtered those away).

seed: 43
sample_rate: 44100
max_steps: 96000
batch_size: 8
segment_seconds: 10.0
lr: 3.0e-4
num_workers: 4
channels: 2

log_every: 1000
val_every: 1000
val_max_batches: null

sources:
  - stem
  - other

# Fight mixture collapse: weight the quieter target stem in waveform L1.
source_loss_weights:
  stem: 8.0
  other: 1.0
# Differentiable −SI-SDR on the stem source (aligned with paper metric).
sisdr_loss_weight: 1.0
# Train + val: reject (or for val, search past) crops below this energy ratio.
stem_min_energy_ratio: 0.05
# Build mix as sum of listed stems so other = mix - stem stays exact.
rebuild_mix_from_stems: true

# Songs with at least this many on-disk stems (from songs.csv).
min_stems: 2
# Held-out fraction of multi-stem songs for validation / SI-SDR eval.
val_fraction: 0.02

# Chunked release root (override with SPDMX_DATASET_ROOT / spdmx_root).
# spdmx_root: /deepfreeze/share/SPDMX/SPDMX
