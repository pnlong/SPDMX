# Multi-instrument transcription (YourMT3 / MT3-style scale-up).
min_stems: 2
seed: 43
# Step-based training (full multitrack epochs are huge; don't wait for epoch end).
train_steps: 100000
# Lightning val_check_interval: run validation every N optimizer steps.
val_interval_steps: 2000
# Caps how many train crops count as one "epoch" for the sampler / progress.
samples_per_epoch: 90000
# Cap Lightning validation to this many batches (full val is ~270 and very slow).
limit_val_batches: 32
val_fraction: 0.05
test_fraction: 0.05
# Slakh: use redux only (exclude omitted/) for AMT.
slakh_include_omitted: false
arms: [slakh, spdmx, both]
# Optional hour-matched SPDMX subsample (~Slakh song-hours).
hour_matched_hours: 145.0
